name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt
      - run: pip install -r backend/requirements.txt -c backend/constraints.txt
      # Unit, API, stress (P-003), validation, spike and the live-server API smoke test (tests/smoke).
      - run: python -m pytest -q

  frontend:
    name: Frontend (tsc, vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser-e2e:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  mission-journey:
    # Space Mission Design end to end: starts the real backend and the real UI and flies an Earth-to-Moon mission in a browser
    # (frontend/e2e/mission.real-backend.e2e.mjs). The other browser job uses a stubbed API; this one does not.
    name: Mission journey (real backend, browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt -c backend/constraints.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e:mission
        working-directory: frontend
        env:
          E2E_PYTHON: python
      - name: Screenshots of the journey
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission-journey-screenshots
          path: frontend/test-results/mission/
          if-no-files-found: ignore
